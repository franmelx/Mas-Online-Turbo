<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,sans-serif;color:#ecfff4;background:#063f2b}body{overflow:hidden}.scene{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:7%;background:radial-gradient(circle at 75% 25%,#22b66d55,transparent 35%),linear-gradient(135deg,#063f2b,#0a7650)}.copy{flex:1;max-width:680px}.copy h1{margin:0 0 14px;font-size:clamp(32px,6vw,78px);letter-spacing:-.05em}.copy p{font-size:clamp(16px,2.3vw,30px);line-height:1.25;margin:0;max-width:620px;color:#c9f7dc}.badge{display:inline-block;margin-bottom:18px;padding:7px 13px;border:1px solid #8df0b6;border-radius:999px;color:#8df0b6;font-weight:700}.visual{flex:0 1 440px;display:flex;justify-content:center}.card{width:320px;border:1px solid #ffffff40;border-radius:22px;padding:22px;background:#f7f9fb;color:#1d2733;box-shadow:0 25px 80px #001d1466}.head{display:flex;align-items:center;gap:12px;background:#0b7a3e;color:#fff;margin:-22px -22px 18px;padding:18px 22px;border-radius:22px 22px 0 0}.head img{width:58px;height:58px}.head strong{font-size:21px}.toggle{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #dce6df}.on{width:38px;height:22px;border-radius:99px;background:#13a65b;position:relative}.on:after{content:'';position:absolute;width:16px;height:16px;right:3px;top:3px;border-radius:50%;background:#fff}.metrics{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{padding:12px;border-radius:10px;background:#e7f7ee}.metric b{display:block;font-size:23px;color:#08723c}.metric span{font-size:12px;color:#4b6658}@media(max-width:700px){.scene{padding:6%}.copy p{font-size:16px}.visual{flex-basis:190px}.card{transform:scale(.72)}}
@media(max-width:500px){.scene{padding:0}.copy{display:none}.visual{flex:1 1 100%;height:100%;align-items:center}.card{transform:scale(.58);flex:none}}
</style></head>
<body><div class="scene"><section class="copy"><div class="badge">Extensión no oficial</div><h1>MasOnline Turbo</h1><p>Menos consultas repetidas. Una navegación más fluida por productos, filtros y precios.</p></section><section class="visual"><div class="card"><div class="head"><img src="logo-300.png"><strong>MasOnline Turbo</strong></div><div class="toggle"><span>Eliminar duplicados</span><i class="on"></i></div><div class="toggle"><span>Agrupar stock y precio</span><i class="on"></i></div><div class="metrics"><div class="metric"><b>36 → 1</b><span>ejemplo de agrupación</span></div><div class="metric"><b>0</b><span>repetidas al volver</span></div><div class="metric"><b>16 MiB</b><span>presupuesto de caché</span></div><div class="metric"><b>Local</b><span>sin servidor externo</span></div></div></div></section></div></body></html>
